<!DOCTYPE html>

<html lang=“hy”>

<head>

<meta charset=“UTF-8”>

<meta name=“viewport” content=“width=device-width, initial-scale=1.0”>

<title>Amore Wedding Invitation</title>

<style>

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

}

html, body {

  width: 100%;

  height: 100%;

  overflow: hidden;

}

#amore {

  position: relative;

  width: 100%;

  height: 100vh;

  height: 100svh;

  overflow: hidden;

  background: #f8e9df;

}

.castle {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  object-position: center;

  transition: transform 6s cubic-bezier(.2,.7,.2,1);

}

.light {

  position: absolute;

  inset: 0;

  background: radial-gradient(

    circle at center,

    rgba(255,231,187,.5),

    transparent 70%

  );

  opacity: 0;

  pointer-events: none;

  transition: opacity 3s;

}

.invite-button {

  position: absolute;

  z-index: 3;

  bottom: 7%;

  left: 50%;

  transform: translateX(-50%);

  width: 245px;

  padding: 17px 10px;

  border: 1px solid #bd9064;

  outline: 2px solid rgba(189,144,100,.25);

  outline-offset: 4px;

  border-radius: 50px;

  background: #fff3e8;

  color: #986640;

  font-family: Georgia, serif;

  font-size: 19px;

  letter-spacing: .5px;

  box-shadow: 0 5px 25px rgba(107,69,43,.15);

  cursor: pointer;

  white-space: nowrap;

  transition: opacity .8s, transform .5s;

}

.invite-button:active {

  transform: translateX(-50%) scale(.96);

}

#amore.open .castle {

  transform: scale(1.3);

}

#amore.open .light {

  opacity: 1;

}

#amore.open .invite-button {

  opacity: 0;

  pointer-events: none;

}

@media(max-width:600px) {

  .castle {

    object-position: center;

  }

  .invite-button {

    bottom: 7%;

    width: 245px;

  }

}

</style>

</head>

<body>

<div id=“amore”>

  <img

    src=“./castle.png”

    class=“castle”

    alt=“Wedding Castle”

  >

  <div class=“light”></div>

  <button class=“invite-button” id=“openInvite”>

    Բացել հրավերը

  </button>

</div>

<script>

const amore = document.getElementById(“amore”);

const button = document.getElementById(“openInvite”);

button.addEventListener(“click”, () => {

  amore.classList.add(“open”);

});

</script>

</body>

</html>
