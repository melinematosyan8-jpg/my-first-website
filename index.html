<div id=“amore-open”>

  <div id=“amore-open-photo”></div>

  <button id=“amore-open-hit” aria-label=“Open invitation”></button>

</div>

<style>

  #amore-open {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100vh;

    height: 100dvh;

    z-index: 999999;

    overflow: hidden;

    background: #f8f3ec;

    transition: opacity 1s ease, transform 1.2s ease;

  }

  #amore-open-photo {

    position: absolute;

    inset: 0;

    background-image: url(“https://files.catbox.moe/zrezcd.png”);

    background-position: center center;

    background-repeat: no-repeat;

    background-size: cover;

    transform: scale(1);

    transition: transform 1.5s ease;

  }

  #amore-open-hit {

    position: absolute;

    left: 50%;

    top: 56%;

    transform: translate(-50%, -50%);

    width: 78%;

    height: 24%;

    border: none;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    outline: none;

  }

  #amore-open.amore-opening #amore-open-photo {

    transform: scale(1.12);

  }

  #amore-open.amore-opening {

    opacity: 0;

    pointer-events: none;

  }
  
  body.amore-locked {

    overflow: hidden !important;

    height: 100% !important;

  }

  @media (max-width: 480px) {

    #amore-open-photo {

      background-position: center center;

    }

    #amore-open-hit {

      top: 56%;

      width: 85%;

      height: 25%;

    }

  }

</style>

<script>

(function () {

  function initAmoreOpen() {

    var overlay = document.getElementById(‘amore-open’);

    var button = document.getElementById(‘amore-open-hit’);

    if (!overlay || !button) return;

    document.body.classList.add(‘amore-locked’);

    button.addEventListener(‘click’, function () {

      overlay.classList.add(‘amore-opening’);

      setTimeout(function () {

        overlay.style.display = ‘none’;

        document.body.classList.remove(‘amore-locked’);

        window.dispatchEvent(new Event(‘resize’));

        if (window.t_lazyload_update) {

          window.t_lazyload_update();

        }

      }, 1100);

    });

  }

  if (document.readyState === ‘loading’) {

    document.addEventListener(‘DOMContentLoaded’, initAmoreOpen);

  } else {

    initAmoreOpen();

  }

})();

</script>
