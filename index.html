<div id=“amore-intro”>

  <img class=“castle-image” src=“https://files.catbox.moe/75uygu.png” alt=“Wedding castle”>

  <div class=“golden-light”></div>

  <button class=“open-invite”>Բացել հրավերը</button>

</div>

<style>

#amore-intro {

  position:relative;

  width:100%;

  height:100vh;

  height:100svh;

  min-height:600px;

  overflow:hidden;

  background:#f5e8df;

}

.castle-image {

  width:100%;

  height:100%;

  object-fit:cover;

  object-position:center;

  display:block;

  transition:transform 7s cubic-bezier(.2,.7,.2,1);

}

.open-invite {

  position:absolute;

  bottom:7%;

  left:50%;

  transform:translateX(-50%);

  border:1px solid #c99e70;

  background:#fff8ee;

  color:#93633f;

  padding:17px 36px;

  border-radius:50px;

  font-family:Georgia,serif;

  font-size:16px;

  white-space:nowrap;

  z-index:3;

}

.golden-light {

  position:absolute;

  inset:0;

  background:radial-gradient(

    circle at center,

    #fff0c0 0%,

    transparent 65%

  );

  opacity:0;

  pointer-events:none;

  transition:opacity 3s;

}

#amore-intro.open .castle-image {

  transform:scale(1.3);

}

#amore-intro.open .golden-light {

  opacity:.45;

}

#amore-intro.open .open-invite {

  opacity:0;

  pointer-events:none;

  transition:opacity .7s;

}

</style>

<script>

document.querySelector(‘#amore-intro .open-invite’)

.addEventListener(‘click’,function(){

  document.getElementById(‘amore-intro’)

  .classList.add(‘open’);

});

</script>
