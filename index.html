<!DOCTYPE html>

<html lang=“hy”>

<head>

  <meta charset=“UTF-8”>

  <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>

  <title>Իմ առաջին կայքը</title>

  <style>

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #f5eee5;

      font-family: Georgia, serif;

      color: #59483c;

      text-align: center;

    }

    .card {

      padding: 40px 25px;

      max-width: 400px;

    }

    h1 {

      font-size: 36px;

      font-weight: normal;

    }

    p {

      font-size: 18px;

      line-height: 1.8;

    }

    button {

      margin-top: 20px;

      padding: 14px 28px;

      border: none;

      background: #8b7463;

      color: white;

      border-radius: 30px;

      font-size: 16px;

    }

  </style>

</head>

<body>

  <div class=“card”>

    <h1>Բարի գալուստ 🤍</h1>

    <p>

      Սա իմ առաջին կայքն է։

      <br>

      Ստեղծված է սիրով։

    </p>

    <button onclick=“alert(‘Ես արդեն ստեղծում եմ կայքեր 🤍’)”>

      Սեղմիր ինձ

    </button>

  </div>

</body>

</html>
