<!DOCTYPE html>

<html lang=“hy”>

<head>

<meta charset=“UTF-8”>

<meta name=“viewport” content=“width=device-width, initial-scale=1.0”>

<title>Մկրտության հրավիրատոմս</title>

<style>

html, body {

  margin: 0;

  padding: 0;

  width: 100%;

}

html.amore-opening-lock,

body.amore-opening-lock {

  overflow: hidden !important;

}

/* OPENING */

#amore-open {

  position: fixed;

  top: 0;

  left: 0;

  width: 100%;

  height: 100vh;

  height: 100dvh;

  overflow: hidden;

  background: #d9c2a6;

  z-index: 999999;

  opacity: 1;

  visibility: visible;

  transition:

    opacity 1.1s ease,

    visibility 1.1s ease;

}

/* BACKGROUND IMAGE */

#amore-open-photo {

  position: absolute;

  top: 0;

  left: 0;

  width: 100%;

  height: 100%;

  background-image:

    url(“https://files.catbox.moe/zrezcd.png”);

  background-position: center center;

  background-size: cover;

  background-repeat: no-repeat;

  transform: scale(1.03);

  animation:

    amorePhotoZoom 10s ease-in-out infinite alternate;

}

/* SOFT LIGHT */

#amore-open-dark {

  position: absolute;

  top: 0;

  left: 0;

  width: 100%;

  height: 100%;

  background:

    rgba(255,245,230,0.035);

  pointer-events: none;

}

/* OPEN BUTTON */

#amore-open-button {

  position: absolute;

  left: 50%;

  top: 56%;

  width: 72%;

  height: 25%;

  transform: translate(-50%,-50%);

  border: none;

  background: transparent;

  color: transparent;

  padding: 0;

  z-index: 20;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}

/* OPEN ANIMATION */

#amore-open.amore-closing {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}

/* BUTTON */

#amore-open.amore-closing

#amore-open-button {

  transform:

    translate(-50%,-50%)

    scale(1.15);

  opacity: 0;

  transition:

    transform 0.8s ease,

    opacity 0.8s ease;

}

/* PHOTO */

#amore-open.amore-closing

#amore-open-photo {

  transform: scale(1.15);

  transition:

    transform 1.3s ease;

}

/* PHOTO ZOOM */

@keyframes amorePhotoZoom {

  from {

    transform: scale(1.03);

  }

  to {

    transform: scale(1.09);

  }

}

/* MOBILE */

@media screen and (max-width: 600px) {

  #amore-open-photo {

    background-position: center center;

  }

  #amore-open-button {

    width: 78%;

    height: 24%;

    top: 56%;

  }

}

/* SMALL SCREEN */

@media screen and (max-width: 380px) {

  #amore-open-button {

    width: 82%;

    height: 23%;

  }

}

/* DESKTOP */

@media screen and (min-width: 601px) {

  #amore-open-photo {

    background-position: center center;

  }

  #amore-open-button {

    width: 350px;

    height: 230px;

  }

}

</style>

</head>

<body>

<div id=“amore-open”>

  <div id=“amore-open-photo”></div>

  <div id=“amore-open-dark”></div>

  <button

    id=“amore-open-button”

    type=“button”

    aria-label=“Open invitation”>

  </button>

</div>

<script>

(function() {

  function amoreInitOpening() {

    var opening =

      document.getElementById(“amore-open”);

    var button =

      document.getElementById(“amore-open-button”);

    if (!opening || !button) {

      return;

    }

    /* LOCK SCROLL */

    document.documentElement

      .classList

      .add(“amore-opening-lock”);

    document.body

      .classList

      .add(“amore-opening-lock”);

    /* OPEN */

    button.addEventListener(“click”, function() {

      opening.classList.add(“amore-closing”);

      /* UNLOCK PAGE */

      document.documentElement

        .classList

        .remove(“amore-opening-lock”);

      document.body

        .classList

        .remove(“amore-opening-lock”);

      /* REFRESH PAGE */

      setTimeout(function() {

        opening.style.display = “none”;

        window.dispatchEvent(

          new Event(“scroll”)

        );

        window.dispatchEvent(

          new Event(“resize”)

        );

        /* SECOND REFRESH */

        setTimeout(function() {

          window.dispatchEvent(

            new Event(“scroll”)

          );

        }, 250);

        /* THIRD REFRESH */
       setTimeout(function() {

          window.dispatchEvent(

            new Event(“scroll”)

          );

        }, 700);

        /* TILDA LAZY LOAD */

        if (

          typeof t_lazyload_update ===

          “function”

        ) {

          try {

            t_lazyload_update();

          } catch (e) {}

        }

        /* FINAL REFRESH */

        setTimeout(function() {

          window.dispatchEvent(

            new Event(“scroll”)

          );

        }, 1200);

      }, 850);

      /* REMOVE OPENING */

      setTimeout(function() {

        if (

          opening &&

          opening.parentNode

        ) {

          opening.parentNode

            .removeChild(opening);

        }

      }, 1800);

    });

  }

  /* WAIT */

  if (

    document.readyState ===

    “loading”

  ) {

    document.addEventListener(

      “DOMContentLoaded”,

      amoreInitOpening

    );

  } else {

    amoreInitOpening();

  }

})();

</script>

</body>

</html>
